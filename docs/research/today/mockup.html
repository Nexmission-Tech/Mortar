<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today · Mortar</title>
    <script>
      document.documentElement.classList.toggle('dark', new URLSearchParams(location.search).get('theme') === 'dark')
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Semantic values copied from the application. No runtime dependency. */
      :root {
        --color-ink-50: #fafafa;
        --color-ink-100: #f5f5f5;
        --color-ink-200: #e5e5e5;
        --color-ink-300: #d4d4d4;
        --color-ink-400: #a3a3a3;
        --color-ink-500: #737373;
        --color-ink-600: #525252;
        --color-ink-700: #3a3a3a;
        --color-ink-800: #262626;
        --color-ink-900: #141414;
        --color-ink-950: #0a0a0a;
        --color-paper-0: #ffffff;
        --color-paper-50: #fcfcfc;
        --color-paper-100: #fafafa;
        --color-paper-200: #f5f5f5;
        --color-paper-300: #efefef;
        --color-paper-400: #e5e5e5;
        --color-paper-500: #d4d4d4;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 6px;
        --radius-xl: 6px;
        --radius-2xl: 11.2px;
        --radius-3xl: 22.4px;
        --ease-out: cubic-bezier(0.2, 0.7, 0.3, 1);
        --shadow-overlay: 0 1px 2px rgba(10, 10, 10, 0.06), 0 8px 24px -4px rgba(10, 10, 10, 0.12);
        --shadow-card: var(--elev-card);
        --shadow-card-hover: var(--elev-card-hover);
        --font-heading: 'Geist', ui-sans-serif, system-ui, sans-serif;
        --font-body: 'Geist', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --background: #ffffff;
        --foreground: #0a0a0a;
        --card: #ffffff;
        --card-foreground: var(--foreground);
        --popover: #ffffff;
        --popover-foreground: var(--foreground);
        --sidebar: #ffffff;
        --footer: #ffffff;
        --muted: #f5f5f5;
        --accent: #ebebeb;
        --accent-foreground: var(--foreground);
        --selected: #e4e4e4;
        --skeleton: #ececec;
        --inverse: #0a0a0a;
        --inverse-foreground: #ffffff;
        --primary: #0a0a0a;
        --primary-hover: #262626;
        --primary-foreground: #ffffff;
        --secondary: var(--card);
        --secondary-foreground: var(--foreground);
        --link: #0a0a0a;
        --muted-foreground: #6b6b6b;
        --destructive: #b3261e;
        --destructive-foreground: #ffffff;
        --disabled: #f0f0f0;
        --disabled-foreground: #8a8a8a;
        --border: #d8d8d8;
        --card-border: color-mix(in oklab, var(--color-ink-950) 6%, transparent);
        --input: #c9c9c9;
        --ring: #0a0a0a;
        --elev-card:
          0 1px 2px color-mix(in oklab, var(--color-ink-950) 5%, transparent),
          0 6px 16px -4px color-mix(in oklab, var(--color-ink-950) 8%, transparent);
        --elev-card-hover:
          0 1px 2px color-mix(in oklab, var(--color-ink-950) 6%, transparent),
          0 10px 24px -6px color-mix(in oklab, var(--color-ink-950) 12%, transparent);
        --scrollbar-thumb: #d8d8d8;
        --scrollbar-thumb-hover: #c9c9c9;
        --status-positive: #3e7d5a;
        --status-positive-fg: #1f4d35;
        --status-positive-bg: #eef4f0;
        --status-warning: #a9852f;
        --status-warning-fg: #6b4e16;
        --status-warning-bg: #f8f4e9;
        --status-danger: #a53d4c;
        --status-danger-fg: #7a2230;
        --status-danger-bg: #faeef0;
        --status-info: #3b6395;
        --status-info-fg: #1e3a5f;
        --status-info-bg: #eef2f8;
        --status-neutral: #a3a3a3;
        --status-neutral-fg: #525252;
        --status-neutral-bg: #f5f5f5;
        --status-signed: #0a0a0a;
        --status-signed-fg: #ffffff;
        --status-signed-bg: #0a0a0a;
        --desk-sales-fg: #0e5a55;
        --desk-sales-bg: #e6f2f0;
        --desk-loan-fg: #4b5316;
        --desk-loan-bg: #f1f3e2;
        --desk-legal-fg: #4a3990;
        --desk-legal-bg: #efecfa;
        --desk-manager-fg: #782a69;
        --desk-manager-bg: #f8ecf5;
        --canvas-dot: color-mix(in oklab, var(--color-ink-950) 12%, transparent);
        --sidebar-foreground: var(--foreground);
        --sidebar-primary: var(--primary);
        --sidebar-primary-foreground: var(--primary-foreground);
        --sidebar-accent: var(--accent);
        --sidebar-accent-foreground: var(--foreground);
        --sidebar-border: var(--border);
        --sidebar-ring: var(--ring);
        --sidebar-width: 200px;
        --sidebar-collapsed: 64px;
        --topbar-height: 56px;
        --motion-fast: 120ms;
        --motion-base: 200ms;
        --motion-slow: 250ms;
        --scrim: color-mix(in oklab, var(--color-ink-950) 14%, transparent);
        --scrim-blur: 3px;
      }
      .dark {
        --background: #0a0a0a;
        --foreground: #fafafa;
        --card: #141414;
        --popover: #1c1c1c;
        --sidebar: #0f0f0f;
        --footer: #141414;
        --muted: #1c1c1c;
        --accent: #262626;
        --selected: #202020;
        --skeleton: #1f1f1f;
        --inverse: #fafafa;
        --inverse-foreground: #0a0a0a;
        --primary: #fafafa;
        --primary-hover: #e5e5e5;
        --primary-foreground: #0a0a0a;
        --link: #fafafa;
        --muted-foreground: #a1a1a1;
        --destructive: #e05260;
        --destructive-foreground: #0a0a0a;
        --disabled: #1c1c1c;
        --disabled-foreground: #a3a3a3;
        --border: #262626;
        --card-border: color-mix(in oklab, var(--color-ink-50) 8%, transparent);
        --input: #3a3a3a;
        --ring: #fafafa;
        --elev-card: 0 1px 2px rgba(0, 0, 0, 0.45);
        --elev-card-hover: 0 1px 2px rgba(0, 0, 0, 0.55);
        --scrollbar-thumb: #262626;
        --scrollbar-thumb-hover: #3a3a3a;
        --status-positive: #5fa57e;
        --status-positive-fg: #a7d8bc;
        --status-positive-bg: #12251b;
        --status-warning: #c9a34a;
        --status-warning-fg: #e8ce8a;
        --status-warning-bg: #2a2113;
        --status-danger: #c76a76;
        --status-danger-fg: #e9a8b0;
        --status-danger-bg: #2b141a;
        --status-info: #6e9bd1;
        --status-info-fg: #aec8e8;
        --status-info-bg: #141e2b;
        --status-neutral: #6b6b6b;
        --status-neutral-fg: #d4d4d4;
        --status-neutral-bg: #1c1c1c;
        --status-signed: #fafafa;
        --status-signed-fg: #0a0a0a;
        --status-signed-bg: #fafafa;
        --desk-sales-fg: #8ed4cb;
        --desk-sales-bg: #0f2421;
        --desk-loan-fg: #cbd58c;
        --desk-loan-bg: #1f2210;
        --desk-legal-fg: #c5baf2;
        --desk-legal-bg: #1c182f;
        --desk-manager-fg: #e9b1dd;
        --desk-manager-bg: #2a1426;
        --canvas-dot: color-mix(in oklab, #fafafa 8%, transparent);
        --scrim: color-mix(in oklab, black 45%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) transparent;
      }
      body {
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font: 400 14px/20px var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button,
      input {
        border-radius: var(--radius-md);
      }
      button:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
        background: var(--disabled);
        color: var(--disabled-foreground);
      }
      button,
      a {
        transition:
          background-color var(--motion-fast) var(--ease-out),
          color var(--motion-fast) var(--ease-out);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h2,
      h3 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        stroke: currentColor;
      }
      [hidden] {
        display: none !important;
      }
      .small {
        font-size: 13px;
        line-height: 18px;
      }
      .label {
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .mono {
        font: 500 13px/18px var(--font-mono);
      }
      .money,
      .figure {
        font-variant-numeric: tabular-nums;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .icon-button {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        flex: 0 0 36px;
      }
      .icon-button:hover,
      .ghost:hover {
        background: var(--accent);
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 36px;
        padding: 7px 16px;
        border: 1px solid var(--input);
        background: var(--card);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        white-space: nowrap;
      }
      .button:hover {
        background: var(--accent);
      }
      .ghost {
        background: transparent;
        border: 0;
      }
      .text-button {
        min-height: 36px;
        padding: 8px 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        background: transparent;
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        text-align: left;
      }
      .text-button:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        box-shadow: var(--shadow-card);
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 64px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        z-index: 30;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
      }
      .brand {
        height: 56px;
        width: 64px;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--border);
      }
      .brand svg {
        width: 20px;
        height: 20px;
      }
      .nav-item {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
        border-radius: 6px;
        border: 0;
        background: transparent;
      }
      .nav-item:first-of-type {
        margin-top: 12px;
      }
      .nav-item.active {
        background: var(--selected);
        color: var(--foreground);
      }
      .nav-item:hover {
        background: var(--accent);
      }
      .nav-rule {
        height: 1px;
        background: var(--border);
        width: 40px;
        margin: 12px 0;
      }
      .sidebar-bottom {
        margin-top: auto;
        margin-bottom: 16px;
      }
      .topbar {
        height: 56px;
        position: fixed;
        inset: 0 0 auto 64px;
        background: var(--sidebar);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 20;
      }
      .breadcrumb,
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .breadcrumb {
        font-size: 13px;
      }
      .top-actions {
        gap: 12px;
      }
      .profile {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 0;
        display: grid;
        place-items: center;
        background: var(--desk-sales-bg);
        color: var(--desk-sales-fg);
      }
      .profile.manager {
        background: var(--desk-manager-bg);
        color: var(--desk-manager-fg);
      }
      .mobile-menu {
        display: none;
      }
      .canvas {
        margin-left: 64px;
        padding-top: 56px;
        min-height: 100dvh;
        background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 32px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .page-heading p {
        margin-top: 4px;
        color: var(--muted-foreground);
      }
      .overview {
        display: grid;
        grid-template-columns: 240px 320px minmax(0, 1fr);
        margin-bottom: 12px;
      }
      .metric {
        min-width: 0;
        padding: 8px 20px;
        text-align: left;
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 2px;
        border-radius: 0;
      }
      .metric + .metric {
        border-left: 1px solid var(--border);
      }
      button.metric:hover {
        background: var(--muted);
      }
      .metric-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted-foreground);
      }
      .figure {
        font-size: 30px;
        line-height: 36px;
        letter-spacing: -0.03em;
        font-weight: 600;
      }
      .metric > .small {
        font-size: 12px;
        line-height: 16px;
      }
      .support-person,
      .support-bottom {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .support-bottom {
        width: 100%;
        justify-content: space-between;
      }
      .support-bottom .text-button {
        min-height: 24px;
        padding: 3px 0;
      }
      .due-link {
        min-height: 32px;
        padding: 6px 0;
        font-size: 14px;
        line-height: 20px;
      }
      .workviews {
        display: flex;
        gap: 24px;
        min-height: 48px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 12px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: transparent;
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .tab[aria-selected='true'] {
        color: var(--foreground);
        border-bottom-color: var(--foreground);
      }
      .tab:hover {
        color: var(--foreground);
      }
      .count {
        font-size: 12px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .section-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        margin-bottom: 8px;
      }
      .section-bar .context {
        margin-top: 4px;
        color: var(--muted-foreground);
        font-size: 13px;
        line-height: 18px;
      }
      .filters {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }
      .field {
        position: relative;
        width: 164px;
      }
      .field-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted-foreground);
      }
      .filter-trigger {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 7px 12px;
      }
      .filter-trigger > span {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .filter-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 40;
        padding: 4px;
        width: 208px;
        background: var(--popover);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow-overlay);
      }
      .filter-menu button {
        width: 100%;
        min-height: 36px;
        border: 0;
        background: transparent;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        border-radius: 4px;
      }
      .filter-menu button:hover,
      .filter-menu button[aria-checked='true'] {
        background: var(--accent);
      }
      .queue {
        overflow: visible;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .queue-head {
        display: grid;
        grid-template-columns: minmax(0, 24fr) minmax(0, 23fr) minmax(0, 53fr);
        gap: 12px;
        padding: 6px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }
      .queue-row {
        min-height: 56px;
        padding: 4px 16px;
        display: grid;
        grid-template-columns: minmax(0, 24fr) minmax(0, 23fr) minmax(0, 53fr);
        gap: 8px 12px;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .rows > li:last-child .queue-row {
        border-bottom: 0;
      }
      .identity {
        min-width: 0;
      }
      .booking-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .booking-line .unit {
        flex: 0 0 auto;
      }
      .booking-line .buyer {
        margin: 0;
      }
      .identity .booking-ref {
        margin: 0;
      }
      .unit {
        background: none;
        border: 0;
        padding: 0;
        min-height: 24px;
        font: 500 13px/18px var(--font-mono);
        text-decoration: underline;
        text-decoration-color: var(--input);
        text-underline-offset: 4px;
      }
      .unit:hover {
        text-decoration-color: var(--foreground);
      }
      .buyer {
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .booking-ref {
        display: block;
        margin-top: 4px;
        color: var(--muted-foreground);
      }
      .blocker-column {
        min-width: 0;
      }
      .blocker {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .blocker > svg {
        color: var(--muted-foreground);
      }
      .blocker-text {
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }
      .blocker .blocker-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .blocker-text.generic {
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .status-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 4px;
        padding: 2px 6px;
        background: var(--status-neutral-bg);
        color: var(--status-neutral-fg);
        font: 500 12px/16px var(--font-body);
        width: fit-content;
      }
      .pill::before {
        content: '';
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .danger {
        background: var(--status-danger-bg);
        color: var(--status-danger-fg);
      }
      .warning {
        background: var(--status-warning-bg);
        color: var(--status-warning-fg);
      }
      .positive {
        background: var(--status-positive-bg);
        color: var(--status-positive-fg);
      }
      .role {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 500 12px/16px var(--font-body);
        padding: 2px 6px;
        border-radius: 4px;
        width: fit-content;
        white-space: nowrap;
      }
      .role svg {
        width: 12px;
        height: 12px;
        flex-basis: 12px;
      }
      .role.legal {
        color: var(--desk-legal-fg);
        background: var(--desk-legal-bg);
      }
      .role.loan_admin {
        color: var(--desk-loan-fg);
        background: var(--desk-loan-bg);
      }
      .role.sales_admin {
        color: var(--desk-sales-fg);

          const wasHidden = menu.hidden
          document.querySelectorAll('.filter-menu').forEach((m) => (m.hidden = true))
          document.querySelectorAll('[data-menu]').forEach((b) => b.setAttribute('aria-expanded', 'false'))
          menu.hidden = !wasHidden
          button.setAttribute('aria-expanded', String(wasHidden))
          if (wasHidden) menu.querySelector('[aria-checked="true"]').focus()
        } else if (d.filter) {
          state[d.filter] = d.value
          render()
          $(`trigger-${d.filter}`).focus()
        } else if ('clear' in d) {
          state.risk = 'all'
          state.desk = 'all'
          render()
        } else if (d.details) {
          state.details.has(d.details) ? state.details.delete(d.details) : state.details.add(d.details)
          render()
          document.querySelector(`[data-details="${d.details}"]`).focus()
        } else if (d.case) openCase(d.case)
        else if (d.create) createTask(d.create)
        else if (d.alternative) createTask(d.alternative, true)
        else if (d.ask) {
          const id = d.ask
          state.checking.add(id)
          render()
          setTimeout(() => {
            state.checking.delete(id)
            render()
            notice('Mortar AI could not check. The usual next step is still shown.')
            document.querySelector(`[data-ask="${id}"]`)?.focus()
          }, 600)
        } else if (d.mine) {
          state.mine = d.mine === 'true'
          render()
          document.querySelector(`[data-mine="${d.mine}"]`).focus()
        } else if (d.complete) {
          const task = DATA.tasks.find((t) => t.id === d.complete)
          state.completed.add(d.complete)
          if (task.coversDefault) state.created.delete(task.bookingId)
          render()
          notice(`Completed: ${task.title}`)
          document.querySelector('[data-complete]')?.focus()
        } else if ('allStalled' in d) {
          closeDialog()
          state.risk = 'all'
          state.desk = 'all'
          setView('actions')
        } else if ('team' in d)
          openDialog(
            'Busiest Desk',
            `<div class="owner-line">${role('loan_admin')}<span>Tan Mei Ling</span></div><p>19 Stalled Bookings · ${rm(10609000)} At Risk</p>`
          )
        else if (d.shell) notice(`${d.shell} is available in the live app.`)
      })
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.field')) {
          document.querySelectorAll('.filter-menu').forEach((m) => (m.hidden = true))
          document.querySelectorAll('[data-menu]').forEach((b) => b.setAttribute('aria-expanded', 'false'))
        }
      })
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (!$('overlay').hidden) {
            closeDialog()
            return
          }
          document.querySelectorAll('.filter-menu:not([hidden])').forEach((m) => {
            m.hidden = true
            const trigger = $('trigger-' + m.id.replace('menu-', ''))
            trigger.setAttribute('aria-expanded', 'false')
            trigger.focus()
          })
          document.querySelectorAll('.tip-content').forEach((t) => (t.style.visibility = 'hidden'))
        }
        const tab = event.target.closest('[role="tab"]')
        if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
          event.preventDefault()
          const all = [...document.querySelectorAll('[role="tab"]')]
          const i = all.indexOf(tab)
          const next =
            event.key === 'Home'
              ? all[0]
              : event.key === 'End'
                ? all.at(-1)
                : all[(i + (event.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length]
          setView(next.dataset.view)
          $(next.id).focus()
        }
        const menu = event.target.closest('[role="menu"]')
        if (menu && ['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) {
          event.preventDefault()
          const all = [...menu.querySelectorAll('button')]
          const i = all.indexOf(event.target)
          ;(event.key === 'Home'
            ? all[0]
            : event.key === 'End'
              ? all.at(-1)
              : all[(i + (event.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length]
          ).focus()
        }
        if (event.key === 'Tab' && !$('overlay').hidden) {
          const focusable = [...$('overlay').querySelectorAll('button, a[href], [tabindex="0"]')]
          const first = focusable[0],
            last = focusable.at(-1)
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault()
            last.focus()
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault()
            first.focus()
          }
        }
      })
      document.addEventListener('pointerover', () =>
        document.querySelectorAll('.tip-content').forEach((t) => (t.style.visibility = ''))
      )
      document.addEventListener('focusin', () =>
        document.querySelectorAll('.tip-content').forEach((t) => (t.style.visibility = ''))
      )
      $('count-metric').onclick = () => {
        state.risk = 'all'
        state.desk = 'all'
        setView('actions')
      }
      $('value-metric').onclick = () =>
        openDialog(
          'Value At Risk',
          `<p class="figure">${rm(manager ? 17118000 : 11795000)}</p><p class="muted">The booking value of stalled cases ${manager ? 'across all desks' : 'you can access'}. This is not collected revenue.</p><button class="text-button" ${manager ? 'data-team' : 'data-all-stalled'}>${manager ? 'Open Team' : 'View All Stalled'}</button>`
        )
      $('theme-toggle').onclick = () => {
        document.documentElement.classList.toggle('dark')
        $('theme-toggle').setAttribute(
          'aria-label',
          document.documentElement.classList.contains('dark') ? 'Switch to light theme' : 'Switch to dark theme'
        )
      }
      $('profile-toggle').onclick = () => {
        const url = new URL(location.href)
        url.searchParams.set('persona', manager ? 'sales-admin' : 'manager')
        if (document.documentElement.classList.contains('dark')) url.searchParams.set('theme', 'dark')
        else url.searchParams.delete('theme')
        location.href = url.href
      }
      $('close-dialog').onclick = closeDialog
      $('dismiss-dialog').onclick = closeDialog
      $('overlay').onclick = (event) => {
        if (event.target === $('overlay')) closeDialog()
      }
      render()
    </script>
  </body>
</html>
